<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日英语学习</title>
<style>
  :root{
    --bg:#f5f4f1; --card:#ffffff; --ink:#2d2a32; --muted:#9b96a3;
    --line:#ececec; --accent:#7c6cf0; --accent-2:#a78bfa;
    --weak:#f0707a; --learning:#f0a93b; --strong:#46b083;
    --tag-wk:#e3f3e8; --tag-pd:#e6ecfb;
    --shadow:0 1px 3px rgba(40,30,80,.05),0 6px 16px rgba(40,30,80,.04);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.65;padding:22px 20px;max-width:760px;margin:0 auto;-webkit-font-smoothing:antialiased;}
  h1{font-size:23px;margin:0 0 4px;font-weight:700;letter-spacing:.3px;}
  .sub{color:var(--muted);font-size:13px;margin:0;}
  .tabs{display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap;}
  .tab{padding:8px 18px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:14px;cursor:pointer;
    transition:.2s;user-select:none;box-shadow:var(--shadow);font-weight:500;}
  .tab:hover{color:var(--ink);}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    border-color:transparent;box-shadow:0 4px 12px rgba(124,108,240,.3);}
  .tab .cnt{opacity:.7;font-size:12px;margin-left:4px;}
  .sec-title{font-size:13px;font-weight:700;margin:24px 0 12px;letter-spacing:.6px;
    display:flex;align-items:center;gap:8px;color:#79748a;}
  .sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 8px;text-align:center;box-shadow:var(--shadow);}
  .stat .n{font-size:25px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
  .card.due{border-left:4px solid var(--weak);}
  .card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
    padding-bottom:12px;border-bottom:2px solid var(--line);}
  .card-head .title{font-size:18px;font-weight:800;line-height:1.35;color:var(--ink);
    letter-spacing:.2px;flex:1;}
  .cat{border-radius:7px;padding:3px 9px;font-size:11px;white-space:nowrap;font-weight:600;
    flex-shrink:0;align-self:center;}
  .cat.外刊{background:var(--tag-wk);color:#2f7d4f;}
  .cat.播客{background:var(--tag-pd);color:#3a5fb0;}
  .para{margin:11px 0;line-height:1.5;position:relative;}
  .para:first-child{margin-top:2px;}
  .para:last-child{margin-bottom:2px;}
  .para .en{font-style:normal;color:#33303a;letter-spacing:0;line-height:1.4;
    font-family:"Verdana","Geneva",sans-serif;display:inline;}
  .para .cn{color:#8a8593;font-size:13px;margin-top:8px;display:block;line-height:1.7;}
  .cn-toggle{display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;color:var(--accent);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 10px;cursor:pointer;
    transition:.15s;font-weight:600;}
  .cn-toggle:hover{border-color:var(--accent);box-shadow:0 2px 6px rgba(124,108,240,.15);}
  .para-items{background:#faf9fc;border:1px solid #f0eef7;border-radius:12px;padding:4px 14px;margin:4px 0 16px;}
  .item{padding:11px 0;border-top:1px solid #f1f0f4;}
  .item:first-of-type{border-top:none;}
  .item .t{font-weight:600;color:var(--accent);font-size:15px;}
  .item .u{font-size:13.5px;color:#5b5660;margin-top:4px;line-height:1.6;}
  .item.remembered{opacity:.55;}
  .item.remembered .t{color:var(--strong);}
  .item .done{font-size:11px;color:var(--strong);margin-left:6px;font-weight:400;}
  .btns{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;padding:5px 0;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:11px;cursor:pointer;transition:.15s;color:var(--ink);font-weight:600;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.r.on{background:var(--strong);color:#fff;border-color:var(--strong);box-shadow:0 3px 8px rgba(70,176,131,.3);}
  .btn.fz.on{background:var(--learning);color:#fff;border-color:var(--learning);box-shadow:0 3px 8px rgba(240,169,59,.3);}
  .btn.fg.on{background:var(--weak);color:#fff;border-color:var(--weak);box-shadow:0 3px 8px rgba(240,112,122,.3);}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:6px 0 14px;flex-wrap:wrap;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle;}
  .bar{height:6px;border-radius:4px;background:#eee;overflow:hidden;margin-top:6px;}
  .bar > span{display:block;height:100%;border-radius:4px;}
  .empty{color:var(--muted);font-size:13px;padding:14px 4px;text-align:center;}
  .note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);}
  .sync-tag{font-size:11px;color:var(--strong);margin-left:6px;}

  /* ── 手机端：放大阅读字号，不影响桌面 ── */
  @media (max-width:600px){
    body{padding:16px 14px;}
    h1{font-size:21px;}
    .sub{font-size:13.5px;}
    .tabs{gap:6px;margin:14px 0 18px;}
    .tab{padding:9px 16px;font-size:15px;}
    .card{padding:15px 14px;}
    .card-head{margin-bottom:12px;padding-bottom:10px;}
    .card-head .title{font-size:19px;}
    .para .en{font-size:17px;line-height:1.45;}
    .para .cn{font-size:15px;margin-top:10px;}
    .cn-toggle{font-size:12px;padding:3px 11px;}
    .item .t{font-size:16.5px;}
    .item .u{font-size:15px;line-height:1.65;}
    .btn{padding:6px 0;font-size:11.5px;}
    .stats{gap:7px;}
    .stat .n{font-size:23px;}
    .stat .l{font-size:11px;}
    .sec-title{font-size:13px;}
  }
</style>
</head>
<body>
  <h1>每日英语学习</h1>
  <div class="sub">GetNote 自动同步 · 间隔重复（学后 1 / 3 / 7 / 14 / 30 天）· <span id="sync-state">已连接</span></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部 <span class="cnt" id="c-all"></span></div>
    <div class="tab" data-cat="外刊">外刊 <span class="cnt" id="c-wk"></span></div>
    <div class="tab" data-cat="播客">播客 <span class="cnt" id="c-pd"></span></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="s-total">0</div><div class="l">累计可学点</div></div>
    <div class="stat"><div class="n" id="s-due">0</div><div class="l">今日待复习</div></div>
    <div class="stat"><div class="n" id="s-grad">0</div><div class="l">已掌握</div></div>
    <div class="stat"><div class="n" id="s-rate">0%</div><div class="l">掌握率</div></div>
  </div>

  <div class="sec-title"><span class="dot"></span>今日复习</div>
  <div id="due-list"></div>

  <div class="sec-title"><span class="dot"></span>记忆状态</div>
  <div class="legend">
    <span><i style="background:var(--weak)"></i>快忘了（weak）</span>
    <span><i style="background:var(--learning)"></i>巩固中（learning）</span>
    <span><i style="background:var(--strong)"></i>牢固（strong）</span>
  </div>
  <div id="status-list"></div>

  <div class="sec-title"><span class="dot"></span>知识库（全部文章）</div>
  <div id="kb-list"></div>

  <div class="note">
    你在手机/电脑上点「记住 / 模糊 / 忘了」，结果会<b>自动回写</b>到看板数据（经由服务端，无需再单独告诉我）。
    断网时会先存在本机，联网后自动补传。<br>
    每日往 GetNote 补 1–2 篇后，跟我说"同步"，我会拉新笔记 → AI 提取 → 更新看板。
  </div>

<script>
const LS_KEY = "eng_review_fb_v2";
const ENDPOINT = "https://english-review-board.mqchloe-eng-review.workers.dev";  // Cloudflare Worker
const SECRET  = "eng-review-shared-2026";  // 与 Worker 端一致（仅防随意调用，非敏感）

let DATA = null, currentCat = "all", TODAY = "";
let cnOpen = {};
let pending = {};   // id -> verdict，尚未成功回写服务端
try { pending = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e){}

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function parse(s){ return new Date(s + "T00:00:00"); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

function itemNextDue(it){ return it.review ? it.review.nextDue : null; }
function itemStrength(it){ return it.review ? it.review.strength : "weak"; }
function itemReviews(it){ return it.review ? it.review.reviews : 0; }

/* 一个 item 当前是否算"已掌握/本次完成"：本地标过 remember，或服务端已复习且下次到期在未来 */
function itemDone(it){
  const loc = pending[it.id];
  if (loc === "remember") return true;
  if (loc === "forget")   return false;
  return it.review && it.review.reviews > 0 && itemNextDue(it) > TODAY;
}
function itemDue(it){ return itemNextDue(it) && itemNextDue(it) <= TODAY && !itemDone(it); }
function articleDue(a){ return a.items.some(itemDue); }

function strengthOfArticle(a){
  const order = {"weak":0,"learning":1,"strong":2};
  let mn = 2;
  for (const it of a.items) mn = Math.min(mn, order[itemStrength(it)]);
  return ["weak","learning","strong"][mn];
}
function strengthColor(s){ return s==="strong"?"var(--strong)":s==="learning"?"var(--learning)":"var(--weak)"; }

function filtered(arr){ return currentCat==="all" ? arr : arr.filter(a=>a.category===currentCat); }

function renderStats(){
  const all = DATA.articles;
  const list = filtered(all);
  let total=0, due=0, done=0;
  for (const a of list) for (const it of a.items){
    total++;
    if (itemDue(it)) due++;
    if (itemDone(it)) done++;
  }
  document.getElementById("s-total").textContent = total;
  document.getElementById("s-due").textContent = due;
  document.getElementById("s-grad").textContent = done;
  document.getElementById("s-rate").textContent = total ? Math.round(done/total*100)+"%" : "0%";
  document.getElementById("c-all").textContent = all.length;
  document.getElementById("c-wk").textContent = all.filter(a=>a.category==="外刊").length;
  document.getElementById("c-pd").textContent = all.filter(a=>a.category==="播客").length;
}

function itemHTML(it, withBtns, aid){
  const loc = pending[it.id];
  const done = itemDone(it);
  const f = loc || (done ? "remember" : null);
  const doneTag = done ? `<span class="done">✓ 已记住</span>` : "";
  const btns = withBtns ? `<div class="btns">
      <button class="btn r ${f==='remember'?'on':''}" onclick="markItem('${aid}','${it.id}','remember')">记住</button>
      <button class="btn fz ${f==='fuzzy'?'on':''}" onclick="markItem('${aid}','${it.id}','fuzzy')">模糊</button>
      <button class="btn fg ${f==='forget'?'on':''}" onclick="markItem('${aid}','${it.id}','forget')">忘了</button>
    </div>` : "";
  return `<div class="item ${done?'remembered':''}"><div class="t">${it.text}${doneTag}</div><div class="u">${it.understanding}</div>${btns}</div>`;
}

function cardHTML(a, withBtns){
  const due = articleDue(a);
  // 按段归集词汇点（paraIdx 对应 paragraphs 下标）
  const byPara = {};
  a.items.forEach(it=>{
    const pi = (typeof it.paraIdx === "number") ? it.paraIdx : a.paragraphs.length;
    (byPara[pi] = byPara[pi] || []).push(it);
  });
  let body = "";
  a.paragraphs.forEach((pg, pi)=>{
    const hasCn = pg.cn && pg.cn.trim();
    const cnShown = cnOpen[a.id+"_"+pi];
    const btn = hasCn ? `<button class="cn-toggle" onclick="toggleCn(this)">${cnShown?'隐藏':'翻译'}</button>` : "";
    const cnHtml = hasCn ? `<div class="cn" style="display:${cnShown?'':'none'}">${pg.cn}</div>` : "";
    body += `<div class="para" data-pidx="${pi}"><span class="en">${pg.en}</span>${btn}${cnHtml}</div>`;
    const its = byPara[pi] || [];
    if (its.length){
      body += `<div class="para-items">` +
              its.map(it=>itemHTML(it, withBtns, a.id)).join("") + `</div>`;
    }
  });
  // 兜底：无对应段落的词汇点放到末尾
  const orphan = byPara[a.paragraphs.length] || [];
  if (orphan.length){
    body += `<div class="para-items">` +
            orphan.map(it=>itemHTML(it, withBtns, a.id)).join("") + `</div>`;
  }
  return `<div class="card ${due?'due':''}" data-bid="${a.id}">
    <div class="card-head"><span class="cat ${a.category}">${a.category}</span><span class="title">${a.source}</span></div>
    ${body}
  </div>`;
}

function renderDue(){
  const list = filtered(DATA.articles).filter(articleDue);
  const el = document.getElementById("due-list");
  el.innerHTML = list.length ? list.map(a=>cardHTML(a,true)).join("")
    : `<div class="empty">这一类今天没有到期内容 🎉</div>`;
}
function renderStatus(){
  const list = filtered(DATA.articles);
  const el = document.getElementById("status-list");
  el.innerHTML = list.map(a=>{
    const s = strengthOfArticle(a);
    const pct = s==="strong"?100:s==="learning"?60:30;
    const prev = a.paragraphs[0] ? a.paragraphs[0].en.slice(0,18) : "";
    return `<div class="card" style="padding:11px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="font-size:14px;font-weight:700;color:var(--ink);">${a.source}</span>
        <span class="cat ${a.category}">${s}</span></div>
      <div class="bar"><span style="width:${pct}%;background:${strengthColor(s)}"></span></div>
    </div>`;
  }).join("");
}
function renderKB(){ document.getElementById("kb-list").innerHTML = filtered(DATA.articles).map(a=>cardHTML(a,false)).join(""); }
function renderAll(){ renderStats(); renderDue(); renderStatus(); renderKB(); }

/* ── 标记 + 自动回写 ── */
function markItem(aid, iid, val){
  const k = iid;                       // 用全局 item id 作为回写键
  pending[k] = (pending[k]===val) ? undefined : val;
  if (!pending[k]) delete pending[k];
  localStorage.setItem(LS_KEY, JSON.stringify(pending));
  renderAll();
  flushPending();
}

/* 把尚未成功回写的标记推给 Worker */
async function flushPending(){
  const ids = Object.keys(pending);
  if (!ids.length) return;
  const batch = ids.map(id=>({ id, verdict: pending[id] }));
  document.getElementById("sync-state").textContent = "回写中…";
  try {
    const r = await fetch(ENDPOINT + "/feedback", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ secret: SECRET, today: TODAY, feedback: batch })
    });
    if (r.ok){
      for (const id of ids) delete pending[id];
      localStorage.setItem(LS_KEY, JSON.stringify(pending));
      document.getElementById("sync-state").textContent = "已自动回写";
    } else {
      document.getElementById("sync-state").textContent = "回写失败，稍后重试";
    }
  } catch(e){
    document.getElementById("sync-state").textContent = "离线，已存本机";
  }
}

function toggleCn(btn){
  const para = btn.closest(".para");
  const bid = para.closest(".card").dataset.bid;
  const pi = para.dataset.pidx;
  const cn = para.querySelector(".cn");
  const show = cn.style.display === "none";
  cn.style.display = show ? "" : "none";
  btn.textContent = show ? "隐藏" : "翻译";
  cnOpen[bid+"_"+pi] = show;
}

document.getElementById("tabs").addEventListener("click", e=>{
  const t = e.target.closest(".tab"); if(!t) return;
  currentCat = t.dataset.cat;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  renderAll();
});

TODAY = todayStr();
fetch("data.json").then(r=>r.json()).then(d=>{
  DATA = d; renderAll();
  flushPending();   // 加载时补传离线期间的标记
}).catch(()=>{
  document.body.insertAdjacentHTML("afterbegin",
    '<p style="color:red">data.json 加载失败，请通过本地服务(http://localhost:8123)打开。</p>');
});
</script>
</body>
</html>
